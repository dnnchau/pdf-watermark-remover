[project]
name = "pdf-watermark-remover"
version = "1.0.0"
description = "Desktop app that finds repeated watermarks in PDFs and removes the ones you pick"
requires-python = ">=3.10"
dependencies = [
    "pymupdf>=1.24",
    "pillow>=10.0",
    "numpy>=1.26",
    "PySide6>=6.6",
]

[project.scripts]
pwr = "pwr_cli.__main__:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
